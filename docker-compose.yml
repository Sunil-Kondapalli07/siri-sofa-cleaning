services:
  siri-sofa-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siri_sofa_app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Persist SQLite database and any runtime uploads
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
