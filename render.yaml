services:
  - type: web
    name: siri-sofa-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 run.py
    envVars:
      - key: PORT
        value: 8000
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: FAST2SMS_SENDER_ID
        value: FSTSMS
      - key: ADMIN_EMAIL
        value: admin@sirisofa.com
